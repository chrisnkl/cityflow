
services:

  database:
    image: postgres:15-alpine
    container_name: cf-backend-db
    environment:
      POSTGRES_DB: cf-db
      POSTGRES_USER: cf-user
      POSTGRES_PASSWORD: cf-password
    ports:
      - "5432:5432"
    volumes:
        - cf-database-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.0.1
    container_name: cf-backend-kafka
    ports:
      - "9092:9092"

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: cf-backend-sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data

volumes:
    cf-database-data:
    sonarqube-data:
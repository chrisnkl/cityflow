server.port=${SERVER_PORT:8081}

spring.application.name=cf-backend
spring.main.banner-mode=off
logging.pattern.console=%clr([%d{yyyy-MM-dd HH:mm:ss.SSS}]){yellow} %clr([%thread]){cyan} %clr([%X{X-REQUEST-ID}]){magenta} %clr(%-5level){highlight} %clr(%logger{36}){bold,blue} - %msg%n

debug=true
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.seedDemoData=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:cf-db}
spring.datasource.username=${DATABASE_USERNAME:cf-user}
spring.datasource.password=${DATABASE_PASSWORD:cf-password}

# Security and JWT configuration
password.encoder.strength=${PASSWORD_ENCODER_STRENGTH:12}
jwt.secret=${JWT_SECRET:LGXFnk+y08Ql8C0k6NlzVN+6I/yYN5977li9K2QWeFfC9/tLm/w5VHRecFd9BjpG97hbKyBivBavom0ZD1boiw==}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:10m}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:7d}
jwt.issuer=${JWT_ISSUER:cf-backend}

# Azure Blob Storage Integration

spring.profiles.active=dev
server.port=${SERVER_PORT:8081}

spring.application.name=cf-backend
spring.main.banner-mode=off
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
logging.pattern.console=%clr([%d{yyyy-MM-dd HH:mm:ss.SSS}]){yellow} %clr([%thread]){cyan} %clr([%X{X-REQUEST-ID}]){magenta} %clr(%-5level){highlight} %clr(%logger{36}){bold,blue} - %msg%n

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.seedDemoData=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:}:${DATABASE_PORT:}/${DATABASE_NAME:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

# Security and JWT configuration
password.encoder.strength=${PASSWORD_ENCODER_STRENGTH:12}
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:10m}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:7d}
jwt.issuer=${JWT_ISSUER:}

# Azure Blob Storage Integration
azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
azure.storage.blob.account-name=${AZURE_STORAGE_ACCOUNT_NAME:}
azure.storage.blob.account-key=${AZURE_STORAGE_ACCOUNT_KEY:}
azure.storage.blob.container-name=${AZURE_STORAGE_BLOB_CONTAINER:}

# RateLimiter Configuration
resilience4j.ratelimiter.instances.authRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.authRateLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.authRateLimiter.timeout-duration=0s

resilience4j.ratelimiter.instances.createReportRateLimiter.limit-for-period=10
resilience4j.ratelimiter.instances.createReportRateLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.createReportRateLimiter.timeout-duration=0s